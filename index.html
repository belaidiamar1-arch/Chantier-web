<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chantier</title>
<meta name="description" content="Gestionnaire de projets d'applications relié à Claude Code.">
<meta name="theme-color" content="#f7f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12111b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chantier">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout : une colonne mobile (max 640px) sur un fond clair à taches de couleur, barre d'onglets flottante, bouton + rond, feuilles qui montent du bas. */
:root {
  --bg: #f7f6fb;
  --surface: #ffffff;
  --surface-2: #f2f0f9;
  --ink: #1e1c2e;
  --muted: #6e6b82;
  --line: #ebe8f3;
  --accent: #6a5cff;
  --accent-ink: #ffffff;
  --accent-soft: #eceaff;
  --coral: #ff7a59;
  --todo: #b3b0c4;
  --doing: #f39c12;
  --doing-soft: #fff1d9;
  --done: #14b37d;
  --done-soft: #dbf6ea;
  --blocked: #f43f5e;
  --blocked-soft: #ffe2e8;
  --claude: #d97742;
  --claude-soft: #fdebdf;
  --blob-1: #ffd8c8;
  --blob-2: #c8f1e2;
  --blob-3: #e2dcff;
  --glass: rgba(255,255,255,.82);
  --shadow: 0 1px 2px rgba(30,28,46,.04), 0 8px 24px rgba(30,28,46,.06);
  --shadow-lg: 0 12px 32px rgba(30,28,46,.12);
  --f-display: "Outfit", "Avenir Next", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12111b; --surface: #1c1a29; --surface-2: #252336; --ink: #efedf8; --muted: #a19eb6; --line: #2d2a40;
    --accent: #9b90ff; --accent-ink: #12111b; --accent-soft: #2b2752; --coral: #ff9478;
    --todo: #6f6c85; --doing: #f7b13e; --doing-soft: #3a2d15; --done: #3fd39c; --done-soft: #163428;
    --blocked: #ff6f86; --blocked-soft: #3e1a24; --claude: #ef9a6a; --claude-soft: #3b2619;
    --blob-1: #3a2230; --blob-2: #15332c; --blob-3: #27224a; --glass: rgba(28,26,41,.85);
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12111b; --surface: #1c1a29; --surface-2: #252336; --ink: #efedf8; --muted: #a19eb6; --line: #2d2a40;
  --accent: #9b90ff; --accent-ink: #12111b; --accent-soft: #2b2752; --coral: #ff9478;
  --todo: #6f6c85; --doing: #f7b13e; --doing-soft: #3a2d15; --done: #3fd39c; --done-soft: #163428;
  --blocked: #ff6f86; --blocked-soft: #3e1a24; --claude: #ef9a6a; --claude-soft: #3b2619;
  --blob-1: #3a2230; --blob-2: #15332c; --blob-3: #27224a; --glass: rgba(28,26,41,.85);
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.45); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(600px 380px at -10% -5%, var(--blob-1), transparent 70%),
    radial-gradient(520px 360px at 110% 0%, var(--blob-2), transparent 70%),
    radial-gradient(700px 500px at 50% 110%, var(--blob-3), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease; }
button:active { transform: scale(.97); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app {
  max-width: 640px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(120px + env(safe-area-inset-bottom, 0px));
}
.sync { position: fixed; z-index: 15; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); font: 600 12px/1 var(--f-body); padding: 7px 11px; border-radius: 99px; background: var(--surface); color: var(--muted); box-shadow: var(--shadow); }
.sync.saving { color: var(--doing); }
.sync.error { color: var(--blocked); background: var(--blocked-soft); }
.setup ol { padding-left: 20px; margin: 8px 0 16px; }
.setup li { margin-bottom: 6px; }
.setup code, .guide code { font: 500 13px/1.4 var(--f-body); background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 7px; overflow-wrap: anywhere; }
.err { color: var(--blocked); font-weight: 600; margin: 0 0 12px; }

/* en-têtes */
.brandline { display: flex; align-items: center; gap: 8px; font: 700 17px/1 var(--f-display); margin-bottom: 18px; }
.brandline .hat { width: 30px; height: 30px; }
.greet { margin-bottom: 18px; }
.greet small { display: block; color: var(--muted); font-weight: 500; }
.greet small::first-letter { text-transform: uppercase; }
.greet h1 { margin: 2px 0 4px; font: 700 34px/1.1 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.greet p { margin: 0; color: var(--muted); font-size: 16px; }
.greet p b { color: var(--ink); font-weight: 600; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 14px; }
.topbar h1 { font: 700 30px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.topbar .back { border: 0; background: var(--surface); width: 42px; height: 42px; border-radius: 50%; box-shadow: var(--shadow); font-size: 18px; flex: none; }
.eyebrow { font-size: 13px; color: var(--muted); }

.btn { border: 0; background: var(--surface-2); border-radius: 99px; padding: 10px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { color: var(--blocked); background: var(--blocked-soft); }
.btn.danger.armed { background: var(--blocked); color: #fff; }
.btn.small { padding: 7px 13px; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.fab {
  position: fixed; z-index: 12; border: 0; width: 58px; height: 58px; border-radius: 50%;
  right: max(20px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(135deg, var(--coral), #ffb347); color: #fff; font: 400 32px/1 var(--f-display);
  box-shadow: 0 10px 24px color-mix(in srgb, var(--coral) 45%, transparent); display: grid; place-items: center;
}

/* tuiles de résumé */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.summary div { border-radius: 20px; padding: 12px 14px; }
.summary div:nth-child(1) { background: var(--accent-soft); }
.summary div:nth-child(2) { background: var(--doing-soft); }
.summary div:nth-child(3) { background: var(--blocked-soft); }
.summary b { display: block; font: 700 26px/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.summary div:nth-child(1) b { color: var(--accent); }
.summary div:nth-child(2) b { color: var(--doing); }
.summary div:nth-child(3) b { color: var(--blocked); }
.summary span { font-size: 13px; color: var(--ink); opacity: .75; }

.list { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border-radius: 24px; padding: 16px 18px; box-shadow: var(--shadow); border: 0; text-align: left; width: 100%; display: block; }
.card h3 { margin: 0; font: 700 19px/1.25 var(--f-display); letter-spacing: -.01em; }
.card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.pcard p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
.card .meta span { background: var(--glass); padding: 4px 9px; border-radius: 99px; }

.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 10px; display: flex; }
.bar i { display: block; height: 100%; }
.bar .d { background: var(--done); } .bar .p { background: var(--doing); } .bar .b { background: var(--blocked); }

/* carte projet */
.pcard {
  --pc: var(--accent);
  display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center;
  background: linear-gradient(140deg, color-mix(in srgb, var(--pc) 18%, var(--surface)) 0%, var(--surface) 65%);
}
.pcard > div { min-width: 0; }
.picon { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; color: #fff; font: 700 20px/1 var(--f-display); background: var(--pc); box-shadow: 0 6px 14px color-mix(in srgb, var(--pc) 35%, transparent); align-self: start; }
.ring { position: relative; width: 58px; height: 58px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 14px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.ring.big { width: 76px; height: 76px; }
.ring.big span { font-size: 18px; }

/* page projet */
.phead { --pc: var(--accent); border-radius: 28px; padding: 18px; margin-bottom: 16px; background: linear-gradient(140deg, color-mix(in srgb, var(--pc) 22%, var(--surface)) 0%, var(--surface) 75%); box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; }
.phead .desc { margin: 0; color: var(--muted); grid-column: 1; }
.phead .stats { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.phead .stats span { background: var(--glass); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 500; }
.links { display: flex; gap: 8px; flex-wrap: wrap; grid-column: 1 / -1; }
.links a { font-size: 13px; font-weight: 600; text-decoration: none; background: var(--surface); color: var(--ink); padding: 8px 13px; border-radius: 99px; box-shadow: var(--shadow); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { color: var(--muted); margin: -4px 0 14px; }

.section-head { display: flex; align-items: center; gap: 8px; margin: 24px 0 12px; }
.section-head h2 { font: 700 20px/1.2 var(--f-display); margin: 0; flex: 1; }

.ms { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.ms + .ms { margin-top: 12px; }
.ms-head { padding: 16px 18px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; }
.ms-num { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; font: 700 15px/1 var(--f-display); background: var(--surface-2); color: var(--muted); }
.ms-num.doing { background: var(--doing-soft); color: var(--doing); }
.ms-num.done { background: var(--done-soft); color: var(--done); }
.ms-num.active { background: var(--accent); color: var(--accent-ink); }
.ms-head h3 { margin: 0; font: 700 17px/1.25 var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.ms-head .pct { font: 700 16px/1.25 var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.ms-head .sub { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.ms-head .bar { grid-column: 1 / -1; margin-top: 2px; }
.ms-head .edit { border: 0; background: none; color: var(--accent); padding: 0 4px; font-size: 13px; font-weight: 600; }
.ms.collapsed .tasks, .ms.collapsed .add-task { display: none; }
.ms-toggle { border: 0; background: none; padding: 0; text-align: left; min-width: 0; }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--f-body); padding: 5px 10px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.todo { background: var(--surface-2); color: var(--muted); }
.pill.doing { background: var(--doing-soft); color: var(--doing); }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.blocked { background: var(--blocked-soft); color: var(--blocked); }
.pill.active { background: var(--accent-soft); color: var(--accent); }
.pill.claude { background: var(--claude-soft); color: var(--claude); }

.tasks { padding: 0 8px; }
.task { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 11px 10px; align-items: start; }
.task + .task { border-top: 1px solid var(--line); }
.status-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--todo); background: transparent; display: grid; place-items: center; padding: 0; margin-top: 1px; font: 700 13px/1 var(--f-body); color: #fff; }
.status-btn.doing { border-color: var(--doing); background: conic-gradient(var(--doing) 0 50%, transparent 50% 100%); }
.status-btn.done { border-color: var(--done); background: var(--done); }
.status-btn.blocked { border-color: var(--blocked); background: var(--blocked); }
.task-body { border: 0; background: none; text-align: left; padding: 0; min-width: 0; }
.task-title { display: block; overflow-wrap: anywhere; font-weight: 500; }
.task.done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); font-weight: 400; }
.task-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; align-items: center; font-size: 12px; color: var(--muted); }
.add-task { display: flex; gap: 8px; padding: 10px 14px 14px; }
.add-task input { flex: 1; min-width: 0; border: 0; background: var(--surface-2); border-radius: 99px; padding: 10px 16px; }

.empty { text-align: center; padding: 34px 18px; color: var(--muted); background: var(--glass); border-radius: 24px; border: 2px dashed var(--line); }
.empty b { display: block; color: var(--ink); font: 700 19px/1.3 var(--f-display); margin-bottom: 4px; }

.idea-compose { background: var(--surface); border-radius: 24px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 18px; }
.idea-compose textarea { width: 100%; border: 0; background: transparent; resize: vertical; min-height: 70px; outline: none; font-size: 16px; }
.list.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.idea { border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); background: var(--surface); }
.idea:nth-child(4n+1) { background: color-mix(in srgb, #ffd166 22%, var(--surface)); }
.idea:nth-child(4n+2) { background: color-mix(in srgb, #7ee0c3 22%, var(--surface)); }
.idea:nth-child(4n+3) { background: color-mix(in srgb, #b9a8ff 24%, var(--surface)); }
.idea:nth-child(4n+4) { background: color-mix(in srgb, #ffa98f 22%, var(--surface)); }
.idea p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; }
.idea .task-meta { margin-top: 10px; }
.idea .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.idea .btn { background: var(--glass); }
.filters { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
.chip { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 99px; padding: 8px 14px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); }

/* barre d'onglets flottante */
.tabbar {
  position: fixed; z-index: 10;
  left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-radius: 26px; box-shadow: var(--shadow-lg); padding: 6px;
  max-width: 440px; margin: 0 auto;
}
.tabbar .inner { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tabbar button { border: 0; background: none; padding: 9px 4px; border-radius: 20px; font: 600 12px/1.2 var(--f-body); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button.on { color: var(--accent); background: var(--accent-soft); }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(20,18,35,.4); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 640px; max-height: 90%; overflow: auto;
  border-radius: 30px 30px 0 0;
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: up .22s cubic-bezier(.2,.9,.3,1.2);
}
.sheet::before { content: ""; display: block; width: 42px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } button { transition: none; } }
.sheet h2 { font: 700 24px/1.2 var(--f-display); margin: 0 0 16px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select { border: 2px solid transparent; background: var(--surface-2); border-radius: 16px; padding: 11px 14px; width: 100%; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.field textarea { min-height: 80px; resize: vertical; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 0; background: var(--surface-2); border-radius: 14px; padding: 10px 4px; font-size: 13px; font-weight: 600; }
.seg button[data-st="todo"].on { background: var(--ink); color: var(--bg); }
.seg button[data-st="doing"].on { background: var(--doing); color: #fff; }
.seg button[data-st="done"].on { background: var(--done); color: #fff; }
.seg button[data-st="blocked"].on { background: var(--blocked); color: #fff; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px transparent; }
.swatches button.on { box-shadow: 0 0 0 2px var(--ink); }
.sheet-actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

.guide h3 { font: 700 19px/1.3 var(--f-display); margin: 24px 0 8px; }
.guide p, .guide li { color: var(--ink); max-width: 65ch; }
.guide ol { padding-left: 20px; }
.code { position: relative; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
.code pre { margin: 0; padding: 16px; overflow-x: auto; font: 400 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre; }
.code .btn { position: absolute; top: 10px; right: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 99px; font-size: 14px; font-weight: 500; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg); }

.hat { color: var(--accent); flex: none; }
.hero { border-radius: 28px; padding: 22px 20px; margin-bottom: 16px; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: center; background: linear-gradient(140deg, color-mix(in srgb, var(--accent) 20%, var(--surface)), var(--surface) 70%); box-shadow: var(--shadow); }
.hero .hat { width: 56px; height: 56px; grid-row: span 2; }
.hero h1 { margin: 0; font: 700 32px/1 var(--f-display); letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--muted); font-weight: 500; }
.brand { display: none; }

@media (min-width: 900px) {
  body { padding-left: 250px; }
  .app { max-width: 780px; }
  .tabbar { top: 14px; bottom: 14px; left: 14px; right: auto; width: 222px; max-width: none; margin: 0; padding: 20px 12px; border-radius: 28px; }
  .tabbar .inner { grid-template-columns: 1fr; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 21px/1 var(--f-display); padding: 0 8px 22px; }
  .brand .hat { width: 32px; height: 32px; }
  .tabbar button { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 15px; padding: 11px 14px; }
  .fab { bottom: 28px; right: 28px; }
  .toast { bottom: 28px; margin-left: 125px; }
  .brandline { display: none; }
}
</style>
</head>
<body>
<div class="sync" id="sync" hidden></div>
<div class="app" id="app">
  <div class="hero"><svg class="hat" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 33a17 17 0 0 1 34 0z" fill="currentColor"/><rect x="20.5" y="18" width="7" height="10" rx="2.5" fill="#fff" opacity=".35"/><rect x="3" y="32" width="42" height="7" rx="3.5" fill="currentColor"/></svg><h1>Chantier</h1><p>Tes projets d'applications, simplement.</p></div>
  <div class="empty"><b>Chargement de tes projets…</b>Connexion à la base en cours.</div>
</div>

<nav class="tabbar" aria-label="Navigation">
  <div class="inner">
    <div class="brand"><svg class="hat" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 33a17 17 0 0 1 34 0z" fill="currentColor"/><rect x="20.5" y="18" width="7" height="10" rx="2.5" fill="#fff" opacity=".35"/><rect x="3" y="32" width="42" height="7" rx="3.5" fill="currentColor"/></svg>Chantier</div>
    <button id="tab-projects" class="on" data-tab="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v5"/></svg>Projets</button>
    <button id="tab-ideas" data-tab="ideas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>Idées</button>
    <button id="tab-guide" data-tab="guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12"/></svg>Claude Code</button>
  </div>
</nav>

<div id="sheet-root"></div>

<script>
const STATUS = { todo: "À faire", doing: "En cours", done: "Terminé", blocked: "Bloqué" };
const CYCLE = { todo: "doing", doing: "done", done: "todo", blocked: "doing" };
const COLORS = ["#5361e8", "#8b5cf6", "#f59e0b", "#22c55e", "#ef4444", "#3b82f6", "#14b8a6", "#64748b"];
const HAT = `<svg class="hat" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 33a17 17 0 0 1 34 0z" fill="currentColor"/><rect x="20.5" y="18" width="7" height="10" rx="2.5" fill="#fff" opacity=".35"/><rect x="3" y="32" width="42" height="7" rx="3.5" fill="currentColor"/></svg>`;

const S = { projects: {}, milestones: {}, tasks: {}, ideas: {}, loaded: 0 };
const ui = { tab: "projects", projectId: null, ideaFilter: "all", collapsed: {} };
try { Object.assign(ui.collapsed, JSON.parse(localStorage.getItem("chantier.collapsed") || "{}")); } catch (e) {}

/* ---------- stockage : data.json dans le dépôt GitHub privé ---------- */
const KINDS = ["projects", "milestones", "tasks", "ideas"];
const CFG_KEY = "chantier.github";
const cfg = { owner: "belaidiamar1-arch", repo: "Chantier-data", path: "data.json", branch: "main", token: "" };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || "{}")); } catch (e) {}
const CACHE_KEY = "chantier.cache";
// Le jeton est gardé dans localStorage et en double dans IndexedDB, au cas où iOS vide l'un des deux.
function idb(mode, fn) {
  return new Promise((res) => {
    try {
      const r = indexedDB.open("chantier", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => {
        try { const tx = r.result.transaction("kv", mode); const q = fn(tx.objectStore("kv")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => res(null); }
        catch (e) { res(null); }
      };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
const saveCfg = () => {
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  idb("readwrite", (st) => st.put(JSON.stringify(cfg), "cfg"));
};
async function restoreCfg() {
  if (cfg.token) { idb("readwrite", (st) => st.put(JSON.stringify(cfg), "cfg")); return; }
  const v = await idb("readonly", (st) => st.get("cfg"));
  if (v) { try { Object.assign(cfg, JSON.parse(v)); localStorage.setItem(CFG_KEY, v); } catch (e) {} }
}
function saveCache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(remote)); } catch (e) {} }
function loadCache() {
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (c && c.data) { remote = { sha: c.sha, data: normalize(c.data) }; S.loaded = 4; } } catch (e) {}
}
let retryTimer = null, retries = 0;
let remote = null;          // { sha, data } : dernier état connu sur GitHub
let ops = [];               // modifications locales pas encore envoyées
let syncing = false, flushTimer = null;
const sync = { state: "idle", error: "", auth: false };

function b64decode(s) { const bin = atob(s.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); }
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function gh(method, body) {
  let url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path}`;
  if (method === "GET") url += `?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`;
  const res = await fetch(url, {
    method, cache: "no-store", body: body ? JSON.stringify(body) : undefined,
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
  });
  if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
  return res.json();
}
function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  KINDS.forEach((k) => { if (!d[k] || typeof d[k] !== "object" || Array.isArray(d[k])) d[k] = {}; });
  d.version = d.version || 1;
  return d;
}
function applyOps(data, list) {
  const d = JSON.parse(JSON.stringify(data));
  for (const op of list) {
    const col = d[op.k];
    if (op.type === "set") col[op.id] = { ...op.data };
    else if (op.type === "update") { if (col[op.id]) col[op.id] = { ...col[op.id], ...op.data }; }
    else if (op.type === "delete") delete col[op.id];
  }
  return d;
}
function errText(e) {
  if (e.status === 401) return "Jeton refusé ou expiré";
  if (e.status === 403) return "Jeton sans droit d'écriture";
  if (e.status === 404) return "Dépôt ou fichier introuvable";
  return "Hors ligne";
}
function setSync(state, error = "") {
  sync.state = state; sync.error = error;
  const el = $("#sync"); if (!el) return;
  el.hidden = state === "idle" || state === "ok";
  el.className = "sync " + state;
  el.textContent = state === "saving" ? "Enregistrement…" : state === "error" ? error : "";
}
function refreshView() {
  const d = applyOps(remote ? remote.data : normalize({}), ops);
  KINDS.forEach((k) => { const m = {}; Object.entries(d[k]).forEach(([id, v]) => { m[id] = { ...v, id }; }); S[k] = m; });
  render();
}
function queue(op) {
  ops.push(op); refreshView();
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 600);
}
async function flush() {
  if (syncing || !ops.length || !cfg.token) return;
  syncing = true; setSync("saving");
  const batch = ops.slice();
  try {
    for (let attempt = 0; ; attempt++) {
      const fresh = await gh("GET");
      const next = applyOps(normalize(JSON.parse(b64decode(fresh.content))), batch);
      try {
        const r = await gh("PUT", { message: `Chantier : ${batch.length} modification${batch.length > 1 ? "s" : ""} depuis l'app`, content: b64encode(JSON.stringify(next, null, 2) + "\n"), sha: fresh.sha, branch: cfg.branch });
        remote = { sha: r.content.sha, data: next }; saveCache();
        break;
      } catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 4) continue; throw e; }
    }
    ops = ops.slice(batch.length);
    setSync("ok");
  } catch (e) {
    setSync("error", errText(e) + " : modifications en attente");
  } finally {
    syncing = false; refreshView();
    if (ops.length && sync.state !== "error") flush();
  }
}
async function pull(force) {
  if (!cfg.token || syncing || ops.length) { if (ops.length && !syncing) flush(); return; }
  const a = document.activeElement;
  if (!force && remote && a && a.closest && a.closest("#app") && /INPUT|TEXTAREA/.test(a.tagName) && a.value) return;
  try {
    const f = await gh("GET");
    if (remote && f.sha === remote.sha) { sync.auth = false; retries = 0; if (sync.state !== "ok") { setSync("ok"); render(); } return; }
    remote = { sha: f.sha, data: normalize(JSON.parse(b64decode(f.content))) }; saveCache();
    S.loaded = 4; sync.auth = false; retries = 0; setSync("ok"); refreshView();
  } catch (e) {
    sync.auth = e.status === 401;
    setSync("error", errText(e) + (sync.auth ? "" : " · nouvel essai…"));
    if (!sync.auth) { clearTimeout(retryTimer); retryTimer = setTimeout(() => pull(true), Math.min(30000, 3000 * 2 ** retries++)); }
    render();
  }
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const mkDoc = (k, id) => ({
  id,
  set: async (data) => queue({ type: "set", k, id, data }),
  update: async (data) => queue({ type: "update", k, id, data }),
  delete: async () => queue({ type: "delete", k, id }),
});
const db = {
  doc(p) { const [k, id] = p.split("/"); return mkDoc(k, id); },
  collection(k) { return { doc: (id) => mkDoc(k, id || newId()) }; },
};

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => new Date().toISOString();
const list = (k) => Object.values(S[k]);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.createdAt).localeCompare(String(b.createdAt));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  if (s < 86400 * 30) return `il y a ${Math.floor(s / 86400)} j`;
  return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}
function fmtDate(d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : ""; }

function stats(tasks) {
  const c = { todo: 0, doing: 0, done: 0, blocked: 0 };
  tasks.forEach((t) => { c[t.status in c ? t.status : "todo"]++; });
  const total = tasks.length;
  return { ...c, total, pct: total ? Math.round((c.done / total) * 100) : 0 };
}
function msState(st) {
  if (st.total && st.done === st.total) return ["done", "Terminé"];
  if (st.doing || st.done || st.blocked) return ["doing", "En cours"];
  return ["todo", "Pas commencé"];
}
function barHtml(st) {
  if (!st.total) return `<div class="bar"></div>`;
  const w = (n) => ((n / st.total) * 100).toFixed(2) + "%";
  return `<div class="bar" role="img" aria-label="${st.pct}% terminé"><i class="d" style="width:${w(st.done)}"></i><i class="p" style="width:${w(st.doing)}"></i><i class="b" style="width:${w(st.blocked)}"></i></div>`;
}
function ringHtml(pct, color, big) {
  const r = 15.5, c = 2 * Math.PI * r;
  return `<span class="ring${big ? " big" : ""}" role="img" aria-label="${pct}% terminé"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="4"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c * pct / 100).toFixed(2)} ${c.toFixed(2)}"/></svg><span>${pct}%</span></span>`;
}
function greeting() {
  const h = new Date().getHours();
  return h < 5 ? "Bonne nuit" : h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonsoir";
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
async function write(fn, okMsg) {
  if (!cfg.token) { toast("Connecte d'abord ton dépôt GitHub."); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { toast("Échec de l'enregistrement. Réessaie."); }
}

/* ---------- rendering ---------- */
function render() {
  document.querySelectorAll(".tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === ui.tab));
  const app = $("#app");
  if (!cfg.token || (!remote && sync.auth)) { app.innerHTML = viewSetup(); return; }
  if (ui.tab === "ideas") app.innerHTML = viewIdeas();
  else if (ui.tab === "guide") app.innerHTML = viewGuide();
  else if (ui.projectId && S.projects[ui.projectId]) app.innerHTML = viewProject(S.projects[ui.projectId]);
  else { ui.projectId = null; app.innerHTML = viewProjects(); }
}

function viewProjects() {
  const ps = list("projects").sort((a, b) => String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt)));
  const all = stats(list("tasks"));
  const today = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const line = all.doing || all.blocked
    ? `<b>${all.doing} tâche${all.doing > 1 ? "s" : ""} en cours</b>${all.blocked ? ` et <b>${all.blocked} bloquée${all.blocked > 1 ? "s" : ""}</b>` : ""} sur tes projets.`
    : ps.length ? "Rien en cours : c'est le moment de lancer la suite." : "Ajoute ton premier projet pour commencer.";
  const head = `<div class="brandline">${HAT}Chantier</div>
    <div class="greet"><small>${today}</small><h1>${greeting()} !</h1><p>${line}</p></div>
    <button class="fab" data-act="new-project" aria-label="Nouveau projet">+</button>`;
  if (!ps.length) return head + (S.loaded < 4 ? (sync.state === "error" ? `<div class="empty"><b>Pas de connexion pour l'instant</b>${esc(sync.error)}. L'app réessaie toute seule.</div>` : `<div class="empty"><b>Chargement…</b></div>`) :
    `<div class="empty"><b>Aucun projet pour l'instant</b>Touche le bouton + pour ajouter ton premier projet, puis colle le lien de son dépôt GitHub.</div>`);
  const summary = `<div class="summary">
    <div><b>${ps.length}</b><span>projets</span></div>
    <div><b>${all.doing}</b><span>en cours</span></div>
    <div><b>${all.blocked}</b><span>bloquées</span></div></div>`;
  const cards = ps.map((p) => {
    const ts = list("tasks").filter((t) => t.projectId === p.id);
    const st = stats(ts);
    const ms = list("milestones").filter((m) => m.projectId === p.id).sort(byOrder);
    const active = ms.find((m) => m.active) || ms.find((m) => { const s = stats(ts.filter((t) => t.milestoneId === m.id)); return !(s.total && s.done === s.total); });
    const last = ts.reduce((a, t) => (t.updatedAt > a ? t.updatedAt : a), p.updatedAt || p.createdAt || "");
    const color = esc(p.color || COLORS[0]);
    return `<button class="card pcard" style="--pc:${color}" data-act="open-project" data-id="${p.id}">
      <span class="picon">${esc((p.name || "?").trim().charAt(0).toUpperCase())}</span>
      <div><h3>${esc(p.name)}</h3>
      ${p.description ? `<p>${esc(p.description)}</p>` : ""}
      <div class="meta">${active ? `<span>Jalon : ${esc(active.title)}</span>` : ""}<span>${st.done}/${st.total} tâches</span>${st.doing ? `<span>${st.doing} en cours</span>` : ""}<span>${ago(last)}</span></div></div>
      ${ringHtml(st.pct, color)}
    </button>`;
  }).join("");
  return head + summary + `<div class="list">${cards}</div>`;
}

function taskRow(t) {
  const st = t.status in STATUS ? t.status : "todo";
  const mark = st === "done" ? "✓" : st === "blocked" ? "!" : "";
  return `<div class="task ${st}">
    <button class="status-btn ${st}" data-act="cycle" data-id="${t.id}" aria-label="Statut : ${STATUS[st]}. Changer">${mark}</button>
    <button class="task-body" data-act="edit-task" data-id="${t.id}">
      <span class="task-title">${esc(t.title)}</span>
      <span class="task-meta">${st === "doing" || st === "blocked" ? `<span class="pill ${st}">${STATUS[st]}</span>` : ""}${t.source === "claude" ? `<span class="pill claude">Claude Code</span>` : ""}<span>${ago(t.updatedAt || t.createdAt)}</span></span>
    </button></div>`;
}

function viewProject(p) {
  const ts = list("tasks").filter((t) => t.projectId === p.id);
  const ms = list("milestones").filter((m) => m.projectId === p.id).sort(byOrder);
  const st = stats(ts);
  const links = [["Dépôt", p.repoUrl], ["Session Claude Code", p.sessionUrl], ["Démo", p.demoUrl]]
    .filter(([, u]) => safeUrl(u)).map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`).join("");
  const sortTasks = (arr) => arr.sort((a, b) => {
    const o = { doing: 0, blocked: 1, todo: 2, done: 3 };
    return (o[a.status] ?? 2) - (o[b.status] ?? 2) || String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt));
  });
  const block = (m, idx) => {
    const mts = sortTasks(ts.filter((t) => (m ? t.milestoneId === m.id : !t.milestoneId || !S.milestones[t.milestoneId])));
    const s = stats(mts);
    const key = m ? m.id : "none-" + p.id;
    if (!m && !mts.length) return "";
    const [cls, label] = msState(s);
    const folded = key in ui.collapsed ? ui.collapsed[key] : cls === "done" && !(m && m.active);
    return `<div class="ms ${folded ? "collapsed" : ""}">
      <div class="ms-head">
        <span class="ms-num ${m && m.active ? "active" : cls}">${m ? (cls === "done" ? "✓" : idx + 1) : "·"}</span>
        <button class="ms-toggle" data-act="toggle" data-key="${key}" aria-expanded="${!folded}"><h3>${m ? esc(m.title) : "Sans jalon"}</h3></button>
        <span class="pct">${s.pct}%</span>
        <div class="sub">${m ? `<span class="pill ${cls}">${label}</span>` : ""}${m && m.active ? `<span class="pill active">Jalon actif</span>` : ""}
          <span>${s.done}/${s.total} sous-tâches</span>${s.blocked ? `<span>· ${s.blocked} bloquée${s.blocked > 1 ? "s" : ""}</span>` : ""}
          ${m && m.dueDate ? `<span>· échéance ${fmtDate(m.dueDate)}</span>` : ""}
          ${m ? `<button class="edit" data-act="edit-ms" data-id="${m.id}">Modifier</button>` : ""}</div>
        ${barHtml(s)}
      </div>
      ${mts.length ? `<div class="tasks">${mts.map(taskRow).join("")}</div>` : ""}
      <form class="add-task" data-act="add-task" data-ms="${m ? m.id : ""}">
        <input id="add-${key}" name="title" placeholder="Ajouter une sous-tâche" autocomplete="off" aria-label="Nouvelle sous-tâche">
        <button class="btn small" type="submit">Ajouter</button>
      </form>
    </div>`;
  };
  const color = esc(p.color || COLORS[0]);
  return `<div class="topbar"><button class="back" data-act="home" aria-label="Retour aux projets">←</button><h1>${esc(p.name)}</h1><button class="btn small" data-act="edit-project" data-id="${p.id}">Modifier</button></div>
    <div class="phead" style="--pc:${color}">
      <p class="desc">${p.description ? esc(p.description) : "Ajoute une description avec « Modifier »."}</p>
      ${ringHtml(st.pct, color, true)}
      <div class="stats"><span>${st.done}/${st.total} terminées</span>${st.doing ? `<span>${st.doing} en cours</span>` : ""}${st.blocked ? `<span>${st.blocked} bloquée${st.blocked > 1 ? "s" : ""}</span>` : ""}</div>
      ${links ? `<div class="links">${links}</div>` : ""}
    </div>
    <div class="section-head"><h2>Jalons</h2><button class="btn small" data-act="new-ms">+ Jalon</button></div>
    ${ms.length ? ms.map(block).join("") : `<div class="empty"><b>Pas encore de jalon</b>Découpe le projet en étapes (ex. « V1 jouable », « Publication »). L'avancement se calcule à partir des sous-tâches.</div>`}
    ${block(null) ? `<div class="section-head"><h2>Autres sous-tâches</h2></div>${block(null)}` : ""}`;
}

function viewIdeas() {
  const ps = list("projects");
  let ideas = list("ideas").sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  if (ui.ideaFilter === "free") ideas = ideas.filter((i) => !i.projectId);
  else if (ui.ideaFilter !== "all") ideas = ideas.filter((i) => i.projectId === ui.ideaFilter);
  const filters = [["all", "Toutes"], ["free", "Libres"], ...ps.map((p) => [p.id, p.name])]
    .map(([k, l]) => `<button class="chip ${ui.ideaFilter === k ? "on" : ""}" data-act="idea-filter" data-k="${k}">${esc(l)}</button>`).join("");
  const items = ideas.map((i) => {
    const p = S.projects[i.projectId]; const t = S.tasks[i.taskId];
    return `<div class="idea"><p>${esc(i.text)}</p>
      <div class="task-meta"><span>${ago(i.createdAt)}</span>${p ? `<span class="pill active">${esc(p.name)}</span>` : ""}${t ? `<span class="pill ${t.status}">↳ ${esc(t.title)}</span>` : ""}</div>
      <div class="actions"><button class="btn small" data-act="edit-idea" data-id="${i.id}">Rattacher / modifier</button>${p && !t ? `<button class="btn small ghost" data-act="idea-to-task" data-id="${i.id}">Transformer en sous-tâche</button>` : ""}</div></div>`;
  }).join("");
  return `<div class="topbar"><h1>Idées</h1></div>
    <form class="idea-compose" data-act="add-idea">
      <textarea id="idea-text" name="text" placeholder="Note une idée en vrac…" aria-label="Nouvelle idée"></textarea>
      <div class="row"><span class="eyebrow">Libre, ou à rattacher plus tard à un projet</span><span class="spacer"></span><button class="btn primary small" type="submit">Noter</button></div>
    </form>
    ${ps.length || list("ideas").length ? `<div class="filters">${filters}</div>` : ""}
    ${items ? `<div class="list ideas">${items}</div>` : `<div class="empty"><b>${list("ideas").length ? "Rien dans ce filtre" : "Aucune idée notée"}</b>Écris-la au-dessus, même en trois mots.</div>`}`;
}

const APP_URL = "https://belaidiamar1-arch.github.io/Chantier-web/";
function claudeSnippet() {
  return `## Suivi de projet (Chantier)

Ce projet est suivi dans Chantier : ${APP_URL}
Les données sont dans data.json, dans le dépôt privé
github.com/${cfg.owner}/${cfg.repo} (branche ${cfg.branch}).

À chaque requête de l'utilisateur qui modifie ce projet :
1. Si ${cfg.repo} n'est pas dans la session, attache-le
   (add_repo ${cfg.owner}/${cfg.repo}, accès push), clone-le
   et suis les règles de son CLAUDE.md.
2. Dans data.json, trouve le projet dont "repoUrl" vaut
   "<URL GitHub de ce dépôt>".
3. Jalon : celui du projet avec "active": true ; sinon le premier
   non terminé selon "order" ; sinon null.
4. Au début du travail, ajoute dans "tasks" une entrée
   "cc-<timestamp>" : { projectId, milestoneId,
   title: "<résumé court de la requête>", status: "doing",
   source: "claude", request: "<requête>",
   sessionUrl: "<lien de cette session>", createdAt, updatedAt }
   puis commit et push sur ${cfg.branch}.
5. À la fin, passe "status" à "done" (ou "blocked" avec un
   champ "note"), mets à jour "updatedAt", commit et push.
Statuts possibles : todo, doing, done, blocked.`;
}

    <h3>Connecte ton dépôt de données</h3>

    <ol>
      <li>Ouvre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Fine-grained token</a>.</li>
      <li>Nom : <code>Chantier</code>. Expiration : « No expiration » si proposé, sinon la plus longue possible.</li>
      <li>Repository access : <b>Only select repositories</b> → <code>${esc(cfg.repo)}</code>.</li>
      <li>Permissions → Repository permissions → <b>Contents : Read and write</b>.</li>

    ${ui.tokenWarn ? `<p class="err">${esc(ui.tokenWarn)}</p>` : ""}

    ${field("s-token", "Jeton d'accès", `<input id="s-token" name="token" type="text" required value="" placeholder="github_pat_…" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">`)}

    <p>Chaque requête que tu fais à Claude Code sur un projet peut créer ici une sous-tâche toute seule, la passer « En cours », puis « Terminé » (ou « Bloqué ») quand le travail est fini. L'app se rafraîchit toutes les 20 secondes.</p>

/* ---------- sheets ---------- */
function openSheet(html, onSubmit, after) {
  const root = $("#sheet-root");
  root.innerHTML = `<div class="sheet-wrap" data-act="close-bg"><form class="sheet" role="dialog" aria-modal="true">${html}</form></div>`;
  const form = $(".sheet", root);
  form.addEventListener("submit", async (e) => { e.preventDefault(); const ok = await onSubmit(new FormData(form), form); if (ok !== false) closeSheet(); });
  form.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer la suppression"; return; }
    await after.onDelete(); closeSheet();
  }));
  after?.init?.(form);
  setTimeout(() => form.querySelector("input,textarea")?.focus(), 50);
}
function closeSheet() { $("#sheet-root").innerHTML = ""; }
const field = (id, label, input) => `<div class="field"><label for="${id}">${label}</label>${input}</div>`;

function projectSheet(p) {
  const isNew = !p; p = p || { color: COLORS[list("projects").length % COLORS.length] };
  const sw = COLORS.map((c) => `<button type="button" data-color="${c}" class="${p.color === c ? "on" : ""}" style="background:${c}" aria-label="Couleur ${c}"></button>`).join("");
  openSheet(`<h2>${isNew ? "Nouveau projet" : "Modifier le projet"}</h2>
    ${field("p-name", "Nom", `<input id="p-name" name="name" required value="${esc(p.name)}" placeholder="Ex. Appli budget">`)}
    ${field("p-desc", "Description", `<textarea id="p-desc" name="description" placeholder="En une phrase, à quoi sert l'app">${esc(p.description)}</textarea>`)}
    ${field("p-repo", "Lien du dépôt (GitHub)", `<input id="p-repo" name="repoUrl" type="url" value="${esc(p.repoUrl)}" placeholder="https://github.com/…">`)}
    ${field("p-sess", "Lien Claude Code (session ou environnement)", `<input id="p-sess" name="sessionUrl" type="url" value="${esc(p.sessionUrl)}" placeholder="https://claude.ai/code/…">`)}
    ${field("p-demo", "Lien de démo (optionnel)", `<input id="p-demo" name="demoUrl" type="url" value="${esc(p.demoUrl)}" placeholder="https://…">`)}
    <div class="field"><label>Couleur</label><div class="swatches">${sw}</div></div>
    <div class="sheet-actions"><button class="btn primary" type="submit">${isNew ? "Créer le projet" : "Enregistrer"}</button><button class="btn ghost" type="button" data-act="close">Annuler</button><span class="spacer"></span>${isNew ? "" : `<button class="btn danger" type="button" data-del>Supprimer</button>`}</div>`,
    async (fd, form) => {
      const data = { name: fd.get("name").trim(), description: fd.get("description").trim(), repoUrl: fd.get("repoUrl").trim(), sessionUrl: fd.get("sessionUrl").trim(), demoUrl: fd.get("demoUrl").trim(), color: form.dataset.color || p.color, updatedAt: now() };
      if (isNew) {
        const ref = db.collection("projects").doc();
        await write(() => ref.set({ ...data, createdAt: now() }), "Projet créé");
        ui.projectId = ref.id; render();
      } else await write(() => db.doc("projects/" + p.id).update(data), "Projet enregistré");
    },
    {
      init(form) { form.dataset.color = p.color; form.querySelectorAll("[data-color]").forEach((b) => b.addEventListener("click", () => { form.dataset.color = b.dataset.color; form.querySelectorAll("[data-color]").forEach((x) => x.classList.toggle("on", x === b)); })); },
      async onDelete() {
        const id = p.id;
        for (const t of list("tasks").filter((t) => t.projectId === id)) await write(() => db.doc("tasks/" + t.id).delete());
        for (const m of list("milestones").filter((m) => m.projectId === id)) await write(() => db.doc("milestones/" + m.id).delete());
        await write(() => db.doc("projects/" + id).delete(), "Projet supprimé");
        ui.projectId = null; render();
      },
    });
}

function msSheet(m) {
  const isNew = !m; const pid = ui.projectId; m = m || {};
  openSheet(`<h2>${isNew ? "Nouveau jalon" : "Modifier le jalon"}</h2>
    ${field("m-title", "Titre", `<input id="m-title" name="title" required value="${esc(m.title)}" placeholder="Ex. V1 publiée sur le store">`)}
    ${field("m-due", "Échéance (optionnelle)", `<input id="m-due" name="dueDate" type="date" value="${esc(m.dueDate)}">`)}
    <div class="field"><label for="m-active"><input id="m-active" name="active" type="checkbox" ${m.active ? "checked" : ""}> Jalon actif : les sous-tâches créées par Claude Code y vont</label></div>
    <div class="sheet-actions"><button class="btn primary" type="submit">${isNew ? "Créer le jalon" : "Enregistrer"}</button><button class="btn ghost" type="button" data-act="close">Annuler</button><span class="spacer"></span>${isNew ? "" : `<button class="btn danger" type="button" data-del>Supprimer</button>`}</div>`,
    async (fd) => {
      const active = fd.get("active") === "on";
      const data = { title: fd.get("title").trim(), dueDate: fd.get("dueDate") || "", active, updatedAt: now() };
      const projMs = list("milestones").filter((x) => x.projectId === (m.projectId || pid));
      if (active) for (const o of projMs.filter((x) => x.active && x.id !== m.id)) await write(() => db.doc("milestones/" + o.id).update({ active: false }));
      if (isNew) await write(() => db.collection("milestones").doc().set({ ...data, projectId: pid, order: projMs.length, createdAt: now() }), "Jalon créé");
      else await write(() => db.doc("milestones/" + m.id).update(data), "Jalon enregistré");
      touchProject(m.projectId || pid);
    },
    { async onDelete() {
      for (const t of list("tasks").filter((t) => t.milestoneId === m.id)) await write(() => db.doc("tasks/" + t.id).update({ milestoneId: null }));
      await write(() => db.doc("milestones/" + m.id).delete(), "Jalon supprimé (ses sous-tâches sont gardées)");
    } });
}

function taskSheet(t) {
  const ms = list("milestones").filter((m) => m.projectId === t.projectId).sort(byOrder);
  const opts = `<option value="">Sans jalon</option>` + ms.map((m) => `<option value="${m.id}" ${t.milestoneId === m.id ? "selected" : ""}>${esc(m.title)}</option>`).join("");
  const seg = Object.entries(STATUS).map(([k, l]) => `<button type="button" data-st="${k}" class="${t.status === k ? "on" : ""}">${l}</button>`).join("");
  openSheet(`<h2>Sous-tâche</h2>
    ${field("t-title", "Titre", `<input id="t-title" name="title" required value="${esc(t.title)}">`)}
    <div class="field"><label>Statut</label><div class="seg">${seg}</div></div>
    ${field("t-ms", "Jalon", `<select id="t-ms" name="milestoneId">${opts}</select>`)}
    ${field("t-note", "Note", `<textarea id="t-note" name="note" placeholder="Détails, raison du blocage…">${esc(t.note)}</textarea>`)}
    ${t.source === "claude" ? `<div class="task-meta" style="margin-bottom:8px"><span class="pill claude">Créée par Claude Code</span>${t.request ? `<span>« ${esc(t.request)} »</span>` : ""}${safeUrl(t.sessionUrl) ? `<a href="${esc(t.sessionUrl)}" target="_blank" rel="noopener">Ouvrir la session ↗</a>` : ""}</div>` : ""}
    <div class="sheet-actions"><button class="btn primary" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-act="close">Annuler</button><span class="spacer"></span><button class="btn danger" type="button" data-del>Supprimer</button></div>`,
    async (fd, form) => {
      await write(() => db.doc("tasks/" + t.id).update({ title: fd.get("title").trim(), status: form.dataset.st, milestoneId: fd.get("milestoneId") || null, note: fd.get("note").trim(), updatedAt: now() }), "Sous-tâche enregistrée");
      touchProject(t.projectId);
    },
    {
      init(form) { form.dataset.st = t.status || "todo"; form.querySelectorAll("[data-st]").forEach((b) => b.addEventListener("click", () => { form.dataset.st = b.dataset.st; form.querySelectorAll("[data-st]").forEach((x) => x.classList.toggle("on", x === b)); })); },
      async onDelete() { await write(() => db.doc("tasks/" + t.id).delete(), "Sous-tâche supprimée"); },
    });
}

function ideaSheet(i) {
  const ps = list("projects");
  const popts = `<option value="">Aucun (idée libre)</option>` + ps.map((p) => `<option value="${p.id}" ${i.projectId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const topts = (pid, sel) => `<option value="">Aucune</option>` + list("tasks").filter((t) => t.projectId === pid).map((t) => `<option value="${t.id}" ${sel === t.id ? "selected" : ""}>${esc(t.title)}</option>`).join("");
  openSheet(`<h2>Idée</h2>
    ${field("i-text", "Texte", `<textarea id="i-text" name="text" required>${esc(i.text)}</textarea>`)}
    ${field("i-proj", "Projet", `<select id="i-proj" name="projectId">${popts}</select>`)}
    ${field("i-task", "Sous-tâche liée", `<select id="i-task" name="taskId">${topts(i.projectId, i.taskId)}</select>`)}
    <div class="sheet-actions"><button class="btn primary" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-act="close">Annuler</button><span class="spacer"></span><button class="btn danger" type="button" data-del>Supprimer</button></div>`,
    async (fd) => {
      const projectId = fd.get("projectId") || null;
      await write(() => db.doc("ideas/" + i.id).update({ text: fd.get("text").trim(), projectId, taskId: projectId ? fd.get("taskId") || null : null, updatedAt: now() }), "Idée enregistrée");
    },
    {
      init(form) { $("#i-proj", form).addEventListener("change", (e) => { $("#i-task", form).innerHTML = topts(e.target.value, null); }); },
      async onDelete() { await write(() => db.doc("ideas/" + i.id).delete(), "Idée supprimée"); },
    });
}

function touchProject(id) { if (id && S.projects[id]) write(() => db.doc("projects/" + id).update({ updatedAt: now() })); }

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act], [data-tab]");
  if (!el) return;
  if (el.dataset.tab) { ui.tab = el.dataset.tab; if (ui.tab === "projects" && el.classList.contains("on")) ui.projectId = null; render(); scrollTo(0, 0); return; }
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close-bg" && e.target === el) return closeSheet();
  if (act === "close") return closeSheet();
  if (act === "home") { ui.projectId = null; render(); return; }
  if (act === "open-project") { ui.projectId = id; render(); scrollTo(0, 0); return; }
  if (act === "new-project") return projectSheet(null);
  if (act === "edit-project") return projectSheet(S.projects[id]);
  if (act === "new-ms") return msSheet(null);
  if (act === "edit-ms") return msSheet(S.milestones[id]);
  if (act === "edit-task") return taskSheet(S.tasks[id]);
  if (act === "edit-idea") return ideaSheet(S.ideas[id]);
  if (act === "idea-filter") { ui.ideaFilter = el.dataset.k; render(); return; }
  if (act === "toggle") {
    ui.collapsed[el.dataset.key] = !el.closest(".ms").classList.contains("collapsed");
    try { localStorage.setItem("chantier.collapsed", JSON.stringify(ui.collapsed)); } catch (err) {}
    render(); return;
  }
  if (act === "cycle") {
    const t = S.tasks[id]; if (!t) return;
    await write(() => db.doc("tasks/" + id).update({ status: CYCLE[t.status] || "doing", updatedAt: now() }));
    touchProject(t.projectId); return;
  }
  if (act === "idea-to-task") {
    const i = S.ideas[id]; if (!i) return;
    const ms = list("milestones").filter((m) => m.projectId === i.projectId);
    const target = ms.find((m) => m.active) || null;
    const ref = db.collection("tasks").doc();
    await write(() => ref.set({ projectId: i.projectId, milestoneId: target ? target.id : null, title: i.text.split("\n")[0].slice(0, 140), note: i.text, status: "todo", source: "manual", createdAt: now(), updatedAt: now() }), "Sous-tâche créée");
    await write(() => db.doc("ideas/" + id).update({ taskId: ref.id }));
    return;
  }
  if (act === "sync-now") { if (ops.length) flush(); else { await pull(true); render(); } toast("Synchronisé"); return; }
  if (act === "disconnect") {
    if (!el.classList.contains("armed")) { el.classList.add("armed"); el.textContent = "Confirmer la déconnexion"; return; }
    cfg.token = ""; saveCfg(); remote = null; ops = []; try { localStorage.removeItem(CACHE_KEY); } catch (e) {} KINDS.forEach((k) => { S[k] = {}; }); setSync("idle"); ui.tab = "projects"; render(); return;
  }
  if (act === "copy") {
    const txt = $("#snippet").textContent;
    try { await navigator.clipboard.writeText(txt); toast("Copié"); }
    catch (err) { const r = document.createRange(); r.selectNodeContents($("#snippet")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné : copie-le"); }
  }
});

document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-act]");
  if (!f) return;
  e.preventDefault();
  if (f.dataset.act === "add-task") {
    const title = f.title.value.trim(); if (!title) return;
    f.title.value = "";
    await write(() => db.collection("tasks").doc().set({ projectId: ui.projectId, milestoneId: f.dataset.ms || null, title, status: "todo", source: "manual", createdAt: now(), updatedAt: now() }));
    touchProject(ui.projectId);
    setTimeout(() => $("#add-" + (f.dataset.ms || "none-" + ui.projectId))?.focus(), 30);
  }
  if (f.dataset.act === "setup") {
    const tok = f.token.value.replace(/[\s\u200B-\u200D\uFEFF]/g, "");
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(tok)) {
      ui.tokenWarn = "Ce texte ne ressemble pas à un jeton GitHub : il doit commencer par « github_pat_ » et faire environ 90 caractères. Colle-le à nouveau, en entier.";
      render(); return;
    }
    ui.tokenWarn = "";
    cfg.owner = f.owner.value.trim(); cfg.repo = f.repo.value.trim(); cfg.token = tok;
    saveCfg(); remote = null; sync.auth = false; setSync("idle");
    const b = f.querySelector("button[type=submit]"); b.disabled = true; b.textContent = "Connexion…";
    await pull(true); render();
    if (remote) toast("Connecté à " + cfg.repo);
    return;
  }
  if (f.dataset.act === "add-idea") {
    const text = f.text.value.trim(); if (!text) return;
    f.text.value = "";
    const projectId = ui.ideaFilter !== "all" && ui.ideaFilter !== "free" ? ui.ideaFilter : null;
    await write(() => db.collection("ideas").doc().set({ text, projectId, taskId: null, createdAt: now() }), "Idée notée");
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- boot ---------- */
(async () => {
  await restoreCfg();
  if (cfg.token) loadCache();
  refreshView();
  try { navigator.storage?.persist?.(); } catch (e) {}
  await pull(true);
  setInterval(() => { if (document.visibilityState === "visible") pull(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
