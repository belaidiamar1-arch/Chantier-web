<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chantier</title>
<meta name="description" content="Gestionnaire de projets d'applications relié à Claude Code.">
<meta name="theme-color" content="#151a2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chantier">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: une seule colonne mobile (max 640px), barre d'onglets fixée en bas, feuilles modales qui montent du bas. */
:root {
  --bg: #f3f5fa;
  --surface: #ffffff;
  --ink: #151a2d;
  --muted: #5f6680;
  --line: #e0e4ef;
  --accent: #5361e8;
  --accent-ink: #ffffff;
  --accent-soft: #e6e9fd;
  --todo: #8a90a6;
  --doing: #d98a0b;
  --doing-soft: #fdf1dc;
  --done: #1f9d55;
  --done-soft: #dcf5e6;
  --blocked: #e5484d;
  --blocked-soft: #fde3e3;
  --claude: #3b6fd8;
  --claude-soft: #e3ecfb;
  --nav: #151a2d;
  --nav-ink: #ffffff;
  --nav-muted: #a3aac4;
  --nav-active: #2a3150;
  --shadow: 0 1px 2px rgba(21,26,45,.05), 0 6px 20px rgba(21,26,45,.06);
  --f-display: "Plus Jakarta Sans", "Avenir Next", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1220; --surface: #171c2e; --ink: #e6e9f5; --muted: #9aa1bb; --line: #283049;
    --accent: #8290ff; --accent-ink: #0e1220; --accent-soft: #252c52;
    --todo: #8a90a6; --doing: #f0b048; --doing-soft: #3a2e17; --done: #4fd18a; --done-soft: #17331f;
    --blocked: #ff7b7f; --blocked-soft: #3d1d22; --claude: #7fa6ff; --claude-soft: #1f2a48;
    --nav: #0a0d18; --nav-ink: #ffffff; --nav-muted: #8a91ab; --nav-active: #222a45;
    --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #171c2e; --ink: #e6e9f5; --muted: #9aa1bb; --line: #283049;
  --accent: #8290ff; --accent-ink: #0e1220; --accent-soft: #252c52;
  --todo: #8a90a6; --doing: #f0b048; --doing-soft: #3a2e17; --done: #4fd18a; --done-soft: #17331f;
  --blocked: #ff7b7f; --blocked-soft: #3d1d22; --claude: #7fa6ff; --claude-soft: #1f2a48;
  --nav: #0a0d18; --nav-ink: #ffffff; --nav-muted: #8a91ab; --nav-active: #222a45;
  --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-tap-highlight-color: transparent; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
}
.sync { position: fixed; z-index: 15; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 99px; background: var(--surface); color: var(--muted); box-shadow: var(--shadow); }
.sync.saving { color: var(--doing); }
.sync.error { color: var(--blocked); background: var(--blocked-soft); }
.setup ol { padding-left: 20px; margin: 8px 0 16px; }
.setup li { margin-bottom: 6px; }
.setup code, .guide code { font: 400 13px/1.4 var(--f-mono); background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.err { color: var(--blocked); font-weight: 500; margin: 0 0 12px; }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 12px; }
.topbar h1 { font: 700 28px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.topbar .back { border: 0; background: var(--surface); width: 40px; height: 40px; border-radius: 12px; box-shadow: var(--shadow); font-size: 18px; flex: none; }
.eyebrow { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--blocked); border-color: var(--blocked); background: transparent; }
.btn.danger.armed { background: var(--blocked); color: var(--surface); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
.summary div { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.summary b { display: block; font: 700 22px/1.2 var(--f-display); font-variant-numeric: tabular-nums; }
.summary span { font-size: 12px; color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); border: 0; text-align: left; width: 100%; display: block; }
.card h3 { margin: 0; font: 700 18px/1.25 var(--f-display); letter-spacing: -.01em; }
.card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.card .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; font: 400 12px/1.4 var(--f-mono); color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }

.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 10px; display: flex; }
.bar i { display: block; height: 100%; }
.bar .d { background: var(--done); } .bar .p { background: var(--doing); } .bar .b { background: var(--blocked); }

.links { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 16px; }
.links a { font: 500 13px/1 var(--f-mono); text-decoration: none; background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { color: var(--muted); margin: -4px 0 14px; }

.section-head { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; }
.section-head h2 { font: 700 13px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; margin: 0; color: var(--muted); flex: 1; }

.ms { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.ms + .ms { margin-top: 12px; }
.ms-head { padding: 14px 16px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: start; }
.ms-head h3 { margin: 0; font: 700 17px/1.25 var(--f-display); min-width: 0; overflow-wrap: anywhere; }
.ms-head .pct { font: 500 15px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; }
.ms-head .sub { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.ms-head .bar { grid-column: 1 / -1; margin-top: 4px; }
.ms-head .edit { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 13px; text-decoration: underline; }
.ms.collapsed .tasks, .ms.collapsed .add-task { display: none; }
.ms-toggle { border: 0; background: none; padding: 0; text-align: left; min-width: 0; }

.pill { display: inline-flex; align-items: center; gap: 4px; font: 500 11px/1 var(--f-mono); padding: 4px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.pill.todo { background: var(--line); color: var(--ink); }
.pill.doing { background: var(--doing-soft); color: var(--doing); }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.blocked { background: var(--blocked-soft); color: var(--blocked); }
.pill.active { background: var(--accent-soft); color: var(--accent); }
.pill.claude { background: var(--claude-soft); color: var(--claude); }

.tasks { border-top: 1px solid var(--line); }
.task { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.task:last-child { border-bottom: 0; }
.status-btn { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--todo); background: transparent; display: grid; place-items: center; padding: 0; margin-top: 1px; font-size: 14px; line-height: 1; color: var(--surface); }
.status-btn.doing { border-color: var(--doing); background: linear-gradient(90deg, var(--doing) 50%, transparent 50%); }
.status-btn.done { border-color: var(--done); background: var(--done); }
.status-btn.blocked { border-color: var(--blocked); background: var(--blocked); }
.task-body { border: 0; background: none; text-align: left; padding: 0; min-width: 0; }
.task-title { display: block; overflow-wrap: anywhere; }
.task.done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.task-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; font: 400 11px/1.4 var(--f-mono); color: var(--muted); }
.add-task { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
.add-task input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; }

.empty { text-align: center; padding: 32px 16px; color: var(--muted); background: var(--surface); border-radius: 16px; border: 1px dashed var(--line); }
.empty b { display: block; color: var(--ink); font: 700 18px/1.3 var(--f-display); margin-bottom: 4px; }

.idea-compose { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); margin-bottom: 18px; }
.idea-compose textarea { width: 100%; border: 0; background: transparent; resize: vertical; min-height: 64px; outline: none; }
.idea { background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.idea p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.idea .task-meta { margin-top: 8px; }
.idea .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.filters { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.tabbar .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tabbar button { border: 0; background: none; padding: 8px 4px; border-radius: 10px; font: 500 12px/1.2 var(--f-body); color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button.on { color: var(--accent); background: var(--accent-soft); }

.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(10,16,15,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 640px; max-height: 90%; overflow: auto;
  border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet h2 { font: 700 22px/1.2 var(--f-display); margin: 0 0 14px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 500; color: var(--muted); }
.field input, .field textarea, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; }
.field textarea { min-height: 80px; resize: vertical; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 4px; font-size: 13px; }
.seg button.on { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 32px; height: 32px; border-radius: 10px; border: 2px solid transparent; }
.swatches button.on { border-color: var(--ink); }
.sheet-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

.guide h3 { font: 700 17px/1.3 var(--f-display); margin: 22px 0 8px; }
.guide p, .guide li { color: var(--ink); max-width: 65ch; }
.guide ol { padding-left: 20px; }
.code { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.code pre { margin: 0; padding: 14px; overflow-x: auto; font: 400 12px/1.6 var(--f-mono); white-space: pre; }
.code .btn { position: absolute; top: 8px; right: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.notice { background: var(--doing-soft); color: var(--ink); padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; }

.hat { color: var(--accent); flex: none; }
.hero { background: var(--nav); color: var(--nav-ink); border-radius: 20px; padding: 18px 18px 16px; margin-bottom: 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.hero .hat { width: 56px; height: 56px; grid-row: span 2; color: #6f7cff; }
.hero h1 { margin: 0; font: 800 30px/1 var(--f-display); letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--nav-muted); font-weight: 500; }
.hero .btn { grid-column: 1 / -1; justify-self: start; margin-top: 12px; }
.pcard { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.picon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; color: #fff; font: 800 17px/1 var(--f-display); }
.pcard > div { min-width: 0; }
.brand { display: none; }
.tabbar button.on svg { color: var(--accent); }

@media (min-width: 900px) {
  body { padding-left: 232px; }
  .app { max-width: 760px; }
  .tabbar { top: 0; right: auto; width: 232px; border-top: 0; background: var(--nav); padding: 22px 14px; }
  .tabbar .inner { grid-template-columns: 1fr; max-width: none; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--nav-ink); font: 800 20px/1 var(--f-display); padding: 0 8px 20px; }
  .brand .hat { width: 32px; height: 32px; color: #6f7cff; }
  .tabbar button { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 14px; padding: 10px 12px; color: var(--nav-muted); }
  .tabbar button.on { background: var(--nav-active); color: var(--nav-ink); }
  .tabbar button.on svg { color: #8290ff; }
  .toast { bottom: 24px; margin-left: 116px; }
}
</style>
</head>
<body>
<div class="sync" id="sync" hidden></div>
<div class="app" id="app">
  <div class="hero"><svg class="hat" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 33a17 17 0 0 1 34 0z" fill="currentColor"/><rect x="20.5" y="18" width="7" height="10" rx="2.5" fill="#fff" opacity=".35"/><rect x="3" y="32" width="42" height="7" rx="3.5" fill="currentColor"/></svg><h1>Chantier</h1><p>Tes projets d'applications, simplement.</p></div>
  <div class="empty"><b>Chargement de tes projets…</b>Connexion à la base en cours.</div>
</div>

<nav class="tabbar" aria-label="Navigation">
  <div class="inner">
    <div class="brand"><svg class="hat" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 33a17 17 0 0 1 34 0z" fill="currentColor"/><rect x="20.5" y="18" width="7" height="10" rx="2.5" fill="#fff" opacity=".35"/><rect x="3" y="32" width="42" height="7" rx="3.5" fill="currentColor"/></svg>Chantier</div>
    <button id="tab-projects" class="on" data-tab="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 4v5"/></svg>Projets</button>
    <button id="tab-ideas" data-tab="ideas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>Idées</button>
    <button id="tab-guide" data-tab="guide">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12"/></svg>Claude Code</button>
  </div>
</nav>

<div id="sheet-root"></div>

<script>
const STATUS = { todo: "À faire", doing: "En cours", done: "Terminé", blocked: "Bloqué" };
const CYCLE = { todo: "doing", doing: "done", done: "todo", blocked: "doing" };
const COLORS = ["#5361e8", "#8b5cf6", "#f59e0b", "#22c55e", "#ef4444", "#3b82f6", "#14b8a6", "#64748b"];
const HAT = `<svg class="hat" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 33a17 17 0 0 1 34 0z" fill="currentColor"/><rect x="20.5" y="18" width="7" height="10" rx="2.5" fill="#fff" opacity=".35"/><rect x="3" y="32" width="42" height="7" rx="3.5" fill="currentColor"/></svg>`;

const S = { projects: {}, milestones: {}, tasks: {}, ideas: {}, loaded: 0 };
const ui = { tab: "projects", projectId: null, ideaFilter: "all", collapsed: {} };
try { Object.assign(ui.collapsed, JSON.parse(localStorage.getItem("chantier.collapsed") || "{}")); } catch (e) {}

/* ---------- stockage : data.json dans le dépôt GitHub privé ---------- */
const KINDS = ["projects", "milestones", "tasks", "ideas"];
const CFG_KEY = "chantier.github";
const cfg = { owner: "belaidiamar1-arch", repo: "Chantier-data", path: "data.json", branch: "main", token: "" };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || "{}")); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} };
let remote = null;          // { sha, data } : dernier état connu sur GitHub
let ops = [];               // modifications locales pas encore envoyées
let syncing = false, flushTimer = null;
const sync = { state: "idle", error: "" };

function b64decode(s) { const bin = atob(s.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); }
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function gh(method, body) {
  let url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path}`;
  if (method === "GET") url += `?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`;
  const res = await fetch(url, {
    method, cache: "no-store", body: body ? JSON.stringify(body) : undefined,
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
  });
  if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
  return res.json();
}
function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  KINDS.forEach((k) => { if (!d[k] || typeof d[k] !== "object" || Array.isArray(d[k])) d[k] = {}; });
  d.version = d.version || 1;
  return d;
}
function applyOps(data, list) {
  const d = JSON.parse(JSON.stringify(data));
  for (const op of list) {
    const col = d[op.k];
    if (op.type === "set") col[op.id] = { ...op.data };
    else if (op.type === "update") { if (col[op.id]) col[op.id] = { ...col[op.id], ...op.data }; }
    else if (op.type === "delete") delete col[op.id];
  }
  return d;
}
function errText(e) {
  if (e.status === 401) return "Jeton refusé ou expiré";
  if (e.status === 403) return "Jeton sans droit d'écriture";
  if (e.status === 404) return "Dépôt ou fichier introuvable";
  return "Hors ligne";
}
function setSync(state, error = "") {
  sync.state = state; sync.error = error;
  const el = $("#sync"); if (!el) return;
  el.hidden = state === "idle" || state === "ok";
  el.className = "sync " + state;
  el.textContent = state === "saving" ? "Enregistrement…" : state === "error" ? error : "";
}
function refreshView() {
  const d = applyOps(remote ? remote.data : normalize({}), ops);
  KINDS.forEach((k) => { const m = {}; Object.entries(d[k]).forEach(([id, v]) => { m[id] = { ...v, id }; }); S[k] = m; });
  render();
}
function queue(op) {
  ops.push(op); refreshView();
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 600);
}
async function flush() {
  if (syncing || !ops.length || !cfg.token) return;
  syncing = true; setSync("saving");
  const batch = ops.slice();
  try {
    for (let attempt = 0; ; attempt++) {
      const fresh = await gh("GET");
      const next = applyOps(normalize(JSON.parse(b64decode(fresh.content))), batch);
      try {
        const r = await gh("PUT", { message: `Chantier : ${batch.length} modification${batch.length > 1 ? "s" : ""} depuis l'app`, content: b64encode(JSON.stringify(next, null, 2) + "\n"), sha: fresh.sha, branch: cfg.branch });
        remote = { sha: r.content.sha, data: next };
        break;
      } catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 4) continue; throw e; }
    }
    ops = ops.slice(batch.length);
    setSync("ok");
  } catch (e) {
    setSync("error", errText(e) + " : modifications en attente");
  } finally {
    syncing = false; refreshView();
    if (ops.length && sync.state !== "error") flush();
  }
}
async function pull(force) {
  if (!cfg.token || syncing || ops.length) { if (ops.length && !syncing) flush(); return; }
  const a = document.activeElement;
  if (!force && remote && a && a.closest && a.closest("#app") && /INPUT|TEXTAREA/.test(a.tagName) && a.value) return;
  try {
    const f = await gh("GET");
    if (remote && f.sha === remote.sha) { if (sync.state === "error") setSync("ok"); return; }
    remote = { sha: f.sha, data: normalize(JSON.parse(b64decode(f.content))) };
    S.loaded = 4; setSync("ok"); refreshView();
  } catch (e) {
    setSync("error", errText(e));
    if (!remote) render();
  }
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const mkDoc = (k, id) => ({
  id,
  set: async (data) => queue({ type: "set", k, id, data }),
  update: async (data) => queue({ type: "update", k, id, data }),
  delete: async () => queue({ type: "delete", k, id }),
});
const db = {
  doc(p) { const [k, id] = p.split("/"); return mkDoc(k, id); },
  collection(k) { return { doc: (id) => mkDoc(k, id || newId()) }; },
};

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => new Date().toISOString();
const list = (k) => Object.values(S[k]);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.createdAt).localeCompare(String(b.createdAt));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";

function ago(iso) {
  if (!iso) return "";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  if (s < 86400 * 30) return `il y a ${Math.floor(s / 86400)} j`;
  return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}
function fmtDate(d) { return d ? new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : ""; }

function stats(tasks) {
  const c = { todo: 0, doing: 0, done: 0, blocked: 0 };
  tasks.forEach((t) => { c[t.status in c ? t.status : "todo"]++; });
  const total = tasks.length;
  return { ...c, total, pct: total ? Math.round((c.done / total) * 100) : 0 };
}
function msState(st) {
  if (st.total && st.done === st.total) return ["done", "Terminé"];
  if (st.doing || st.done || st.blocked) return ["doing", "En cours"];
  return ["todo", "Pas commencé"];
}
function barHtml(st) {
  if (!st.total) return `<div class="bar"></div>`;
  const w = (n) => ((n / st.total) * 100).toFixed(2) + "%";
  return `<div class="bar" role="img" aria-label="${st.pct}% terminé"><i class="d" style="width:${w(st.done)}"></i><i class="p" style="width:${w(st.doing)}"></i><i class="b" style="width:${w(st.blocked)}"></i></div>`;
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
async function write(fn, okMsg) {
  if (!cfg.token) { toast("Connecte d'abord ton dépôt GitHub."); return; }
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { toast("Échec de l'enregistrement. Réessaie."); }
}

/* ---------- rendering ---------- */
function render() {
  document.querySelectorAll(".tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === ui.tab));

  if (!cfg.token || (!remote && sync.state === "error")) { app.innerHTML = viewSetup(); return; }
  if (ui.tab === "ideas") app.innerHTML = viewIdeas();
  else if (ui.tab === "guide") app.innerHTML = viewGuide();
  else if (ui.projectId && S.projects[ui.projectId]) app.innerHTML = viewProject(S.projects[ui.projectId]);
  else { ui.projectId = null; app.innerHTML = viewProjects(); }
}

function viewProjects() {
  const ps = list("projects").sort((a, b) => String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt)));
  const all = stats(list("tasks"));
  const head = `<div class="hero">${HAT}<h1>Chantier</h1><p>Tes projets d'applications, simplement.</p><button class="btn primary" data-act="new-project">+ Nouveau projet</button></div>`;
  if (!ps.length) return head + (S.loaded < 4 ? `<div class="empty"><b>Chargement…</b></div>` :
    `<div class="empty"><b>Aucun projet pour l'instant</b>Ajoute ton premier projet avec le bouton « + Projet », puis colle le lien de son dépôt Claude Code.</div>`);
  const summary = `<div class="summary">
    <div><b>${ps.length}</b><span>projets</span></div>
    <div><b>${all.doing}</b><span>tâches en cours</span></div>
    <div><b>${all.blocked}</b><span>bloquées</span></div></div>`;
  const cards = ps.map((p) => {
    const ts = list("tasks").filter((t) => t.projectId === p.id);
    const st = stats(ts);
    const ms = list("milestones").filter((m) => m.projectId === p.id).sort(byOrder);
    const active = ms.find((m) => m.active) || ms.find((m) => { const s = stats(ts.filter((t) => t.milestoneId === m.id)); return !(s.total && s.done === s.total); });
    const last = ts.reduce((a, t) => (t.updatedAt > a ? t.updatedAt : a), p.updatedAt || p.createdAt || "");
    return `<button class="card pcard" data-act="open-project" data-id="${p.id}">
      <span class="picon" style="background:${esc(p.color || COLORS[0])}">${esc((p.name || "?").trim().charAt(0).toUpperCase())}</span>
      <div><h3>${esc(p.name)}</h3>
      ${p.description ? `<p>${esc(p.description)}</p>` : ""}
      ${barHtml(st)}
      <div class="meta"><span>${st.pct}%</span><span>${st.done}/${st.total} tâches</span>${active ? `<span>Jalon : ${esc(active.title)}</span>` : `<span>${ms.length} jalon${ms.length > 1 ? "s" : ""}</span>`}<span>${ago(last)}</span></div></div>

  }).join("");
  return head + summary + `<div class="list">${cards}</div>`;

function taskRow(t) {

}

function viewProject(p) {
  const ts = list("tasks").filter((t) => t.projectId === p.id);
  const ms = list("milestones").filter((m) => m.projectId === p.id).sort(byOrder);
  const st = stats(ts);
  const links = [["Dépôt", p.repoUrl], ["Session Claude Code", p.sessionUrl], ["Démo", p.demoUrl]]
    .filter(([, u]) => safeUrl(u)).map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`).join("");
  const sortTasks = (arr) => arr.sort((a, b) => {
    const o = { doing: 0, blocked: 1, todo: 2, done: 3 };
    return (o[a.status] ?? 2) - (o[b.status] ?? 2) || String(b.updatedAt || b.createdAt).localeCompare(String(a.updatedAt || a.createdAt));
  });
  const block = (m, idx) => {
    const mts = sortTasks(ts.filter((t) => (m ? t.milestoneId === m.id : !t.milestoneId || !S.milestones[t.milestoneId])));
    const s = stats(mts);
    const key = m ? m.id : "none-" + p.id;
    if (!m && !mts.length) return "";
    const [cls, label] = msState(s);
    return `<div class="ms ${ui.collapsed[key] ? "collapsed" : ""}">
      <div class="ms-head">
        <button class="ms-toggle" data-act="toggle" data-key="${key}" aria-expanded="${!ui.collapsed[key]}"><h3>${m ? `${idx + 1}. ${esc(m.title)}` : "Sans jalon"}</h3></button>
        <span class="pct">${s.pct}%</span>
        <div class="sub">${m ? `<span class="pill ${cls}">${label}</span>` : ""}${m && m.active ? `<span class="pill active">Jalon actif</span>` : ""}
          <span>${s.done}/${s.total} sous-tâches</span>${s.blocked ? `<span>· ${s.blocked} bloquée${s.blocked > 1 ? "s" : ""}</span>` : ""}
          ${m && m.dueDate ? `<span>· échéance ${fmtDate(m.dueDate)}</span>` : ""}
          ${m ? `<button class="edit" data-act="edit-ms" data-id="${m.id}">Modifier</button>` : ""}</div>
        ${barHtml(s)}
      </div>
      ${mts.length ? `<div class="tasks">${mts.map(taskRow).join("")}</div>` : ""}
      <form class="add-task" data-act="add-task" data-ms="${m ? m.id : ""}">
        <input id="add-${key}" name="title" placeholder="Ajouter une sous-tâche" autocomplete="off" aria-label="Nouvelle sous-tâche">
        <button class="btn small" type="submit">Ajouter</button>
      </form>
    </div>`;
  };
  return `<div class="topbar"><button class="back" data-act="home" aria-label="Retour aux projets">←</button><h1>${esc(p.name)}</h1><button class="btn small" data-act="edit-project" data-id="${p.id}">Modifier</button></div>
    ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
    ${links ? `<div class="links">${links}</div>` : ""}
    <div class="summary">
      <div><b>${st.pct}%</b><span>avancement</span></div>
      <div><b>${st.doing}</b><span>en cours</span></div>
      <div><b>${st.blocked}</b><span>bloquées</span></div></div>
    <div class="section-head"><h2>Jalons</h2><button class="btn small" data-act="new-ms">+ Jalon</button></div>
    ${ms.length ? ms.map(block).join("") : `<div class="empty"><b>Pas encore de jalon</b>Découpe le projet en étapes (ex. « V1 jouable », « Publication »). L'avancement se calcule à partir des sous-tâches.</div>`}
    ${block(null) ? `<div class="section-head"><h2>Autres sous-tâches</h2></div>${block(null)}` : ""}`;
}

/* ---------- sheets ---------- */
function openSheet(html, onSubmit, after) {
  const root = $("#sheet-root");
  root.innerHTML = `<div class="sheet-wrap" data-act="close-bg"><form class="sheet" role="dialog" aria-modal="true">${html}</form></div>`;
  const form = $(".sheet", root);
  form.addEventListener("submit", async (e) => { e.preventDefault(); const ok = await onSubmit(new FormData(form), form); if (ok !== false) closeSheet(); });
  form.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
    if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Confirmer la suppression"; return; }
    await after.onDelete(); closeSheet();
  }));
  after?.init?.(form);
  setTimeout(() => form.querySelector("input,textarea")?.focus(), 50);
}

const field = (id, label, input) => `<div class="field"><label for="${id}">${label}</label>${input}</div>`;

    },
    {
      init(form) { form.dataset.color = p.color; form.querySelectorAll("[data-color]").forEach((b) => b.addEventListener("click", () => { form.dataset.color = b.dataset.color; form.querySelectorAll("[data-color]").forEach((x) => x.classList.toggle("on", x === b)); })); },
      async onDelete() {
        const id = p.id;
        for (const t of list("tasks").filter((t) => t.projectId === id)) await write(() => db.doc("tasks/" + t.id).delete());
        for (const m of list("milestones").filter((m) => m.projectId === id)) await write(() => db.doc("milestones/" + m.id).delete());
        await write(() => db.doc("projects/" + id).delete(), "Projet supprimé");
        ui.projectId = null; render();
      },
    });
}

function msSheet(m) {
  const isNew = !m; const pid = ui.projectId; m = m || {};
  openSheet(`<h2>${isNew ? "Nouveau jalon" : "Modifier le jalon"}</h2>
    ${field("m-title", "Titre", `<input id="m-title" name="title" required value="${esc(m.title)}" placeholder="Ex. V1 publiée sur le store">`)}
    ${field("m-due", "Échéance (optionnelle)", `<input id="m-due" name="dueDate" type="date" value="${esc(m.dueDate)}">`)}
    <div class="field"><label for="m-active"><input id="m-active" name="active" type="checkbox" ${m.active ? "checked" : ""}> Jalon actif : les sous-tâches créées par Claude Code y vont</label></div>
    <div class="sheet-actions"><button class="btn primary" type="submit">${isNew ? "Créer le jalon" : "Enregistrer"}</button><button class="btn ghost" type="button" data-act="close">Annuler</button><span class="spacer"></span>${isNew ? "" : `<button class="btn danger" type="button" data-del>Supprimer</button>`}</div>`,
    async (fd) => {
      const active = fd.get("active") === "on";
      const data = { title: fd.get("title").trim(), dueDate: fd.get("dueDate") || "", active, updatedAt: now() };
      const projMs = list("milestones").filter((x) => x.projectId === (m.projectId || pid));
      if (active) for (const o of projMs.filter((x) => x.active && x.id !== m.id)) await write(() => db.doc("milestones/" + o.id).update({ active: false }));
      if (isNew) await write(() => db.collection("milestones").doc().set({ ...data, projectId: pid, order: projMs.length, createdAt: now() }), "Jalon créé");
      else await write(() => db.doc("milestones/" + m.id).update(data), "Jalon enregistré");
      touchProject(m.projectId || pid);
    },
    { async onDelete() {
      for (const t of list("tasks").filter((t) => t.milestoneId === m.id)) await write(() => db.doc("tasks/" + t.id).update({ milestoneId: null }));
      await write(() => db.doc("milestones/" + m.id).delete(), "Jalon supprimé (ses sous-tâches sont gardées)");
    } });
}

function taskSheet(t) {
  const ms = list("milestones").filter((m) => m.projectId === t.projectId).sort(byOrder);
  const opts = `<option value="">Sans jalon</option>` + ms.map((m) => `<option value="${m.id}" ${t.milestoneId === m.id ? "selected" : ""}>${esc(m.title)}</option>`).join("");
  const seg = Object.entries(STATUS).map(([k, l]) => `<button type="button" data-st="${k}" class="${t.status === k ? "on" : ""}">${l}</button>`).join("");
  openSheet(`<h2>Sous-tâche</h2>
    ${field("t-title", "Titre", `<input id="t-title" name="title" required value="${esc(t.title)}">`)}
    <div class="field"><label>Statut</label><div class="seg">${seg}</div></div>
    ${field("t-ms", "Jalon", `<select id="t-ms" name="milestoneId">${opts}</select>`)}
    ${field("t-note", "Note", `<textarea id="t-note" name="note" placeholder="Détails, raison du blocage…">${esc(t.note)}</textarea>`)}
    ${t.source === "claude" ? `<div class="task-meta" style="margin-bottom:8px"><span class="pill claude">Créée par Claude Code</span>${t.request ? `<span>« ${esc(t.request)} »</span>` : ""}${safeUrl(t.sessionUrl) ? `<a href="${esc(t.sessionUrl)}" target="_blank" rel="noopener">Ouvrir la session ↗</a>` : ""}</div>` : ""}
    <div class="sheet-actions"><button class="btn primary" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-act="close">Annuler</button><span class="spacer"></span><button class="btn danger" type="button" data-del>Supprimer</button></div>`,
    async (fd, form) => {
      await write(() => db.doc("tasks/" + t.id).update({ title: fd.get("title").trim(), status: form.dataset.st, milestoneId: fd.get("milestoneId") || null, note: fd.get("note").trim(), updatedAt: now() }), "Sous-tâche enregistrée");
      touchProject(t.projectId);
    },
    {
      init(form) { form.dataset.st = t.status || "todo"; form.querySelectorAll("[data-st]").forEach((b) => b.addEventListener("click", () => { form.dataset.st = b.dataset.st; form.querySelectorAll("[data-st]").forEach((x) => x.classList.toggle("on", x === b)); })); },
      async onDelete() { await write(() => db.doc("tasks/" + t.id).delete(), "Sous-tâche supprimée"); },
    });
}

function ideaSheet(i) {
  const ps = list("projects");
  const popts = `<option value="">Aucun (idée libre)</option>` + ps.map((p) => `<option value="${p.id}" ${i.projectId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
  const topts = (pid, sel) => `<option value="">Aucune</option>` + list("tasks").filter((t) => t.projectId === pid).map((t) => `<option value="${t.id}" ${sel === t.id ? "selected" : ""}>${esc(t.title)}</option>`).join("");
  openSheet(`<h2>Idée</h2>
    ${field("i-text", "Texte", `<textarea id="i-text" name="text" required>${esc(i.text)}</textarea>`)}
    ${field("i-proj", "Projet", `<select id="i-proj" name="projectId">${popts}</select>`)}
    ${field("i-task", "Sous-tâche liée", `<select id="i-task" name="taskId">${topts(i.projectId, i.taskId)}</select>`)}
    <div class="sheet-actions"><button class="btn primary" type="submit">Enregistrer</button><button class="btn ghost" type="button" data-act="close">Annuler</button><span class="spacer"></span><button class="btn danger" type="button" data-del>Supprimer</button></div>`,
    async (fd) => {
      const projectId = fd.get("projectId") || null;
      await write(() => db.doc("ideas/" + i.id).update({ text: fd.get("text").trim(), projectId, taskId: projectId ? fd.get("taskId") || null : null, updatedAt: now() }), "Idée enregistrée");
    },
    {
      init(form) { $("#i-proj", form).addEventListener("change", (e) => { $("#i-task", form).innerHTML = topts(e.target.value, null); }); },
      async onDelete() { await write(() => db.doc("ideas/" + i.id).delete(), "Idée supprimée"); },
    });
}

function touchProject(id) { if (id && S.projects[id]) write(() => db.doc("projects/" + id).update({ updatedAt: now() })); }

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act], [data-tab]");
  if (!el) return;
  if (el.dataset.tab) { ui.tab = el.dataset.tab; if (ui.tab === "projects" && el.classList.contains("on")) ui.projectId = null; render(); scrollTo(0, 0); return; }
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "close-bg" && e.target === el) return closeSheet();
  if (act === "close") return closeSheet();
  if (act === "home") { ui.projectId = null; render(); return; }
  if (act === "open-project") { ui.projectId = id; render(); scrollTo(0, 0); return; }
  if (act === "new-project") return projectSheet(null);
  if (act === "edit-project") return projectSheet(S.projects[id]);
  if (act === "new-ms") return msSheet(null);
  if (act === "edit-ms") return msSheet(S.milestones[id]);
  if (act === "edit-task") return taskSheet(S.tasks[id]);
  if (act === "edit-idea") return ideaSheet(S.ideas[id]);
  if (act === "idea-filter") { ui.ideaFilter = el.dataset.k; render(); return; }
  if (act === "toggle") {
    ui.collapsed[el.dataset.key] = !ui.collapsed[el.dataset.key];
    try { localStorage.setItem("chantier.collapsed", JSON.stringify(ui.collapsed)); } catch (err) {}
    render(); return;
  }
  if (act === "cycle") {
    const t = S.tasks[id]; if (!t) return;
    await write(() => db.doc("tasks/" + id).update({ status: CYCLE[t.status] || "doing", updatedAt: now() }));
    touchProject(t.projectId); return;
  }
  if (act === "idea-to-task") {
    const i = S.ideas[id]; if (!i) return;
    const ms = list("milestones").filter((m) => m.projectId === i.projectId);
    const target = ms.find((m) => m.active) || null;
    const ref = db.collection("tasks").doc();
    await write(() => ref.set({ projectId: i.projectId, milestoneId: target ? target.id : null, title: i.text.split("\n")[0].slice(0, 140), note: i.text, status: "todo", source: "manual", createdAt: now(), updatedAt: now() }), "Sous-tâche créée");
    await write(() => db.doc("ideas/" + id).update({ taskId: ref.id }));
    return;
  }
  if (act === "sync-now") { if (ops.length) flush(); else { await pull(true); render(); } toast("Synchronisé"); return; }
  if (act === "disconnect") {
    if (!el.classList.contains("armed")) { el.classList.add("armed"); el.textContent = "Confirmer la déconnexion"; return; }
    cfg.token = ""; saveCfg(); remote = null; ops = []; KINDS.forEach((k) => { S[k] = {}; }); setSync("idle"); ui.tab = "projects"; render(); return;
  }
  if (act === "copy") {
    const txt = $("#snippet").textContent;
    try { await navigator.clipboard.writeText(txt); toast("Copié"); }
    catch (err) { const r = document.createRange(); r.selectNodeContents($("#snippet")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné : copie-le"); }
  }
});

document.addEventListener("submit", async (e) => {
  const f = e.target.closest("form[data-act]");
  if (!f) return;
  e.preventDefault();
  if (f.dataset.act === "add-task") {
    const title = f.title.value.trim(); if (!title) return;
    f.title.value = "";
    await write(() => db.collection("tasks").doc().set({ projectId: ui.projectId, milestoneId: f.dataset.ms || null, title, status: "todo", source: "manual", createdAt: now(), updatedAt: now() }));
    touchProject(ui.projectId);
    setTimeout(() => $("#add-" + (f.dataset.ms || "none-" + ui.projectId))?.focus(), 30);
  }
  if (f.dataset.act === "setup") {
    cfg.owner = f.owner.value.trim(); cfg.repo = f.repo.value.trim(); cfg.token = f.token.value.trim();
    saveCfg(); remote = null; setSync("idle");
    const b = f.querySelector("button[type=submit]"); b.disabled = true; b.textContent = "Connexion…";
    await pull(true); render();
    if (remote) toast("Connecté à " + cfg.repo);
    return;
  }
  if (f.dataset.act === "add-idea") {
    const text = f.text.value.trim(); if (!text) return;
    f.text.value = "";
    const projectId = ui.ideaFilter !== "all" && ui.ideaFilter !== "free" ? ui.ideaFilter : null;
    await write(() => db.collection("ideas").doc().set({ text, projectId, taskId: null, createdAt: now() }), "Idée notée");
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- boot ---------- */
(async () => {
  render();
  await pull(true);
  setInterval(() => { if (document.visibilityState === "visible") pull(); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
